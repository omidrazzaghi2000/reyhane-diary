# Deploys the static site to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'
      - 'data/backups/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate diary data
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('data/diary.json', encoding='utf-8'))
          assert isinstance(d.get('entries'), list), 'entries must be a list'
          print(f"diary.json OK: {len(d['entries'])} entries, {len(d.get('words', []))} words")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
